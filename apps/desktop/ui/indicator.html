<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #bar {
    display: flex; gap: 6px; align-items: center; padding: 8px 10px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
    background: rgba(16,16,18,.85);
  }
  .b { font: 11px/1 system-ui, "Segoe UI", sans-serif; color: #9a9aa3;
    padding: 3px 8px; border-radius: 999px; background: #1c1d21;
    border: 1px solid #2a2b30; white-space: nowrap; }
  .b.on { color: #4ade80; border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.12); }
  .b.off { color: #f87171; border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.12); }
</style>
</head>
<body>
  <div id="bar">
    <span class="b" id="bProt">Защита</span>
    <span class="b" id="bRec">Запись</span>
    <span class="b" id="bAuto">Авто</span>
    <span class="b" id="bTts">Озвучка</span>
  </div>
  <script src="indicator.js"></script>
</body>
</html>
