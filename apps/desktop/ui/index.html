<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #17171c; color: #e8e8ec;
    font: 14px/1.5 system-ui, sans-serif; }
  nav { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid #2a2a32;
    background: #1d1d23; }
  nav a { padding: 5px 14px; border-radius: 6px; color: #9a9aa2; text-decoration: none; }
  nav a.active { background: #2a2a32; color: #e8e8ec; }
  main { padding: 14px; }
  h2 { font-size: 16px; margin: 4px 0 10px; }
  .card { background: #1d1d23; border: 1px solid #2a2a32; border-radius: 10px;
    padding: 12px; margin-bottom: 10px; }
  .card .title { font-weight: 600; }
  .card .sub { font-size: 12px; opacity: .65; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  input, textarea, select { background: #111; color: #e8e8ec; border: 1px solid #3a3a44;
    border-radius: 6px; padding: 6px; font: 13px system-ui; }
  input { flex: 1; min-width: 120px; }
  textarea { width: 100%; box-sizing: border-box; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  button { background: #2a2a32; color: #e8e8ec; border: 1px solid #3a3a44;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: 13px system-ui; }
  button:hover { background: #3a3a44; }
  button.primary { background: #ffb454; color: #111; border-color: #ffb454; }
  .hidden { display: none; }
  label { font-size: 12px; opacity: .7; display: block; margin: 6px 0 2px; }
  .hint { font-size: 11px; opacity: .5; margin-top: 4px; }
</style>
</head>
<body>
  <nav>
    <a href="#meetings" data-view="meetings">Встречи</a>
    <a href="#contexts" data-view="contexts">Контексты</a>
    <a href="#settings" data-view="settings">Настройки</a>
  </nav>
  <main>
    <section id="meetings-view"></section>
    <section id="contexts-view" class="hidden"></section>
    <section id="settings-view" class="hidden"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
