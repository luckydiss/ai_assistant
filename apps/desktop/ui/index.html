<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="topbar">
    <span id="tb-name">AI Assistant</span>
    <span id="tb-version">v0.1</span>
    <button id="tb-prot" class="badge-off" title="Защита от записи экрана">
      <i></i><span>Защита откл.</span>
    </button>
    <span class="spacer"></span>
    <button id="tb-refresh">⟳ Обновить</button>
    <button id="tb-continue" class="primary">▶ Продолжить</button>
    <span id="tb-user">QU</span>
  </header>

  <div id="shell">
    <nav id="rail">
      <button class="rl" id="rl-meetings" title="Встречи"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="rl" id="rl-contexts" title="Контексты"><svg viewBox="0 0 16 16"><path d="M4 1.5h5l3 3v10H4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 8h4M6 10.5h4" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="rl" id="rl-settings" title="Настройки"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="4.5" r="1.6" fill="#17171b" stroke="currentColor" stroke-width="1.4"/><circle cx="10.5" cy="8" r="1.6" fill="#17171b" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="11.5" r="1.6" fill="#17171b" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </nav>

    <aside id="sb" class="hidden">
      <h1 id="sb-title">Настройки</h1>
      <div id="sb-nav"></div>
      <div id="sb-foot">
        <button class="sb-item" id="sb-close"><svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Закрыть</button>
      </div>
    </aside>

    <main id="page">
      <section id="view-root"></section>
    </main>
  </div>

  <div id="modalBack" hidden>
    <div id="modal">
      <h3 id="modalTitle"></h3>
      <p id="modalText" hidden></p>
      <input id="modalInput" hidden>
      <div class="m-actions">
        <button id="modalCancel">Отмена</button>
        <button id="modalOk" class="primary">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
