# Копия-шаблон конфигурации. Скопируйте в config.toml и заполните свои ключи.
# config.toml в git НЕ коммитится (см. .gitignore) — он содержит секреты.

[stt]
provider = "soniox"
api_key = "YOUR_DEEPGRAM_KEY"
soniox_api_key = "YOUR_SONIOX_KEY"
model = "stt-rt-v5"
language_hints = "ru"
language = "auto"
utterance_idle_ms = 2500
max_utterance_chars = 600

[llm]
provider = "openai"
api_key = "YOUR_OPENAI_KEY"
model = "gemini-2.5-flash-lite"
base_url = "https://api.dslab.tech/v1"
temperature = 0.0
max_tokens = 700
reasoning_effort = "low"
search_enabled = false
search_tool_json = ""

[vad]
silence_ms = 600
max_segment_ms = 7000

[prompts]
system = """
Ты — невидимый ассистент на техническом собеседовании.
Даётся диалог: I — интервьюер, C — кандидат.
Кандидат сам запрашивает подсказку, когда нужна помощь.
Отвечай сразу суть: 2–5 буллетов или короткий код-блок.
Язык = язык последнего вопроса I или языка запроса.
Без вступлений и мета-комментариев."""
persona = "Senior Rust developer, 5 years experience"

[audio]
source = "system+mic"
mode = "vad"

[hotkeys]
manual = "Ctrl+2"
hide = "Ctrl+B"
click_through = "Ctrl+W"
mute = "Ctrl+M"
record = "Ctrl+R"
screenshot_full = "Ctrl+H"
screenshot_region = "Ctrl+Shift+H"
tts = "Ctrl+T"

[tts]
mode = "off"
provider = "cartesia"
api_key = "YOUR_CARTESIA_KEY"
model_id = "sonic-3.5"
voice_id = "1e4176b1-3db9-44d6-a601-4fe68b041942"
sample_rate = 22050

[ui]
accent = "#f97316"
opacity = 92
indicator_corner = "top-right"
protection = false

[window]
no_focus = false
move_step = 50
resize_step = 50

[chat]
order = "bottom"
font_size = 13.5
code_theme = "github-dark"
code_scroll = true
autoscroll = true
autoscroll_speed = 100
collapse_transcripts = true
collapse_operations = true
collapse_last = false
compact_quick = true
cancel_on_resend = true
cancel_mode = "drop"
