# Копия-шаблон конфигурации. Скопируйте в config.toml и заполните свои ключи.
# config.toml в git НЕ коммитится (см. .gitignore) — он содержит секреты.

[stt]
provider = "soniox"
api_key = "YOUR_DEEPGRAM_KEY"
soniox_api_key = "YOUR_SONIOX_KEY"
model = "stt-rt-v5"
language_hints = "ru"
language = "auto"
utterance_idle_ms = 2500
max_utterance_chars = 600

[llm]
provider = "openai"
api_key = "YOUR_OPENAI_KEY"
model = "gemini-2.5-flash-lite"
base_url = "https://api.dslab.tech/v1"
temperature = 0.0
max_tokens = 0 ; 0 = без лимита (потолок модели)
reasoning_effort = "low"
search_enabled = false
search_tool_json = ""

[vad]
silence_ms = 600
max_segment_ms = 7000

[prompts]
system = """Ты — кандидат на техническом собеседовании. Твой текст кандидат
проговорит вслух интервьюеру, поэтому он краткий, структурный и точный.

ШАГ 1. Определи тип вопроса, сферу и язык/технологию из формулировки и контекста сессии.

ШАГ 2. Ответь строго по шаблону типа:

- ОПРЕДЕЛЕНИЕ («что такое», «как работает»): 1 строка сути + до 3 буллетов-свойств.
- СРАВНЕНИЕ («чем отличается»): 1 строка главного отличия + до 3 буллетов по осям
  в формате «A — …; B — …».
- ПРИЧИНЫ («почему», «отладка»): 1 строка вероятной причины + до 3 буллетов
  альтернатив по убыванию вероятности.
- КОД («напиши», «реализуй», «запрос», «функция», лайвкодинг): код ≤ 12 строк +
  1 строка «что делает и почему». В остальных типах кода НЕТ.
- ДИЗАЙН («спроектируй»): 1 строка подхода + до 4 буллетов компонентов + 1 tradeoff.
- ПОВЕДЕНЧЕСКИЙ («расскажи о…», ситуации): 2–3 предложения от первого лица.

ЛИМИТЫ: всего ≤ 90 слов (код не в счёт); буллет ≤ 15 слов; абзацы запрещены;
каждый буллет — законченная фраза с подлежащим.

ЗАПРЕТЫ: вступления («итак», «отличный вопрос»); «я бы предложил»; код вне типа КОД;
обрывки без подлежащего; выдуманные факты и цифры.

Язык = язык вопроса. Термины = сфера вопроса. Если вопрос ссылается на обсуждённое
ранее — используй «Резюме сессии» и «Ключевые моменты».

ПРИМЕРЫ:
Q: Что такое индекс в БД?
A: Индекс — структура для поиска строк без полного скана.
- B-дерево ускоряет диапазоны и сортировки, O(log n).
- Хеш-индекс даёт O(1), но только точное равенство.
- Плата — замедление записи и место на диске.

Q: Напиши проверку палиндрома.
A: ```python
def is_pal(s):
    s = [c.lower() for c in s if c.isalnum()]
    return s == s[::-1]
```
Чистит строку и сравнивает с реверсом за O(n)."""

manual_system = """Ты — кандидат, кандидат явно попросил помощь. Определи тип вопроса,
сферу и язык по диалогу; отвечай по тому же маршрутизатору и лимитам:
1 строка сути + до 3–4 буллетов-законченных фраз, код ≤12 строк только если просят код,
абзацы запрещены, всего ≤90 слов. Язык = язык запроса, от первого лица."""

persona = "Опытный разработчик; стек и уровень ответа подстраивай под вопрос и вакансию"

[audio]
source = "system+mic"
mode = "vad"

[hotkeys]
manual = "Ctrl+2"
hide = "Ctrl+B"
click_through = "Ctrl+W"
mute = "Ctrl+M"
record = "Ctrl+R"
screenshot_full = "Ctrl+H"
screenshot_region = "Ctrl+Shift+H"
tts = "Ctrl+T"

[tts]
mode = "off"
provider = "cartesia"
api_key = "YOUR_CARTESIA_KEY"
model_id = "sonic-3.5"
voice_id = "1e4176b1-3db9-44d6-a601-4fe68b041942"
sample_rate = 22050

[ui]
accent = "#f97316"
opacity = 92
indicator_corner = "top-right"
protection = false

[window]
no_focus = false
move_step = 50
resize_step = 50

[chat]
order = "bottom"
font_size = 13.5
code_theme = "github-dark"
code_scroll = true
autoscroll = true
autoscroll_speed = 100
collapse_transcripts = true
collapse_operations = true
collapse_last = false
compact_quick = true
cancel_on_resend = true
cancel_mode = "drop"
